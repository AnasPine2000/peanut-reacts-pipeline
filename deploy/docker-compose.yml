# Peanut Reacts Pipeline - production deployment
# Run on any Linux VPS with Docker installed.
#
# Setup:
#   1. Copy .env.example to .env, fill in API keys
#   2. Place client_secret.json into ./secrets/
#   3. Place youtube_token.json into ./tokens/ (after first OAuth on local machine)
#   4. docker compose up -d
#
# Persistent state lives in named volumes so updates don't lose data.

version: "3.9"

services:

  # ── Main scheduler daemon ─────────────────────────────────────
  scheduler:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: peanut-reacts:latest
    container_name: peanut-scheduler
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - TZ=Europe/Amsterdam
      - PYTHONPATH=/app/src
    volumes:
      - peanut_data:/data
      - peanut_output:/output
      - ./tokens:/tokens:rw
      - ./secrets:/secrets:ro
      - ./channels.yaml:/app/channels.yaml:ro
    networks:
      - peanut_net
    # Override default cmd to use volumes-aware paths
    command: ["python", "-m", "peanut_reacts.scheduler.runner"]

  # ── Gradio dashboard (also acts as health/status web UI) ──────
  dashboard:
    image: peanut-reacts:latest
    container_name: peanut-dashboard
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app/src
    volumes:
      - peanut_data:/data:ro
      - peanut_output:/output:ro
    networks:
      - peanut_net
    ports:
      - "7860:7860"  # Gradio default port
    command: ["python", "/app/dashboard/app.py"]
    depends_on:
      - scheduler

  # ── Optional: Lofi/Ambient 24/7 livestream ────────────────────
  livestream:
    image: peanut-reacts:latest
    container_name: peanut-livestream
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app/src
    volumes:
      - peanut_output:/output:ro
    networks:
      - peanut_net
    command: ["python", "/app/scripts/livestream_loop.py"]
    depends_on:
      - scheduler
    profiles:
      - livestream  # Only starts with: docker compose --profile livestream up -d

volumes:
  peanut_data:
    driver: local
  peanut_output:
    driver: local

networks:
  peanut_net:
    driver: bridge
