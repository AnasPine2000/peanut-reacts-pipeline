# ═══════════════════════════════════════════════════════════════
# Multi-Channel YouTube Pipeline Configuration
# Each channel has its own character, schedule, and content source
# ═══════════════════════════════════════════════════════════════

channels:
  # ── Channel 1: Peanut Reacts (Sidemen Among Us) ──────────────
  # Pivoted from "5hr silent compilation" (competitively doomed per
  # research: Sidemen officials own 23M+ in same keywords, YPP rule
  # now targets low-transformation compilations) to the same Peanut-
  # reaction stack used by peanut_ksi: AI 3D character PIP, context-
  # aware vision verdicts, calm British butler persona, 25s clips x 18.
  # Source is the curated Sidemen Among Us playlists instead of generic
  # fail compilations. Character IS the transformation -> fair-use safer.
  - id: uk_clips
    name: "Peanut Reacts: Sidemen Among Us"
    character: peanut
    execution_env: local
    # live_reaction: Peanut watches the FULL Sidemen episode (20-30min)
    # and interjects ~every 60s. NOT the TNTL clip-chop format.
    source_type: live_reaction
    source_urls:
      - "https://www.youtube.com/playlist?list=PLhjLcvbbPVrVOY5w5Pl7KuSe5fGroQJJD"   # SIDEMEN AMONG US (full eps)
      - "https://www.youtube.com/playlist?list=PLhjLcvbbPVrVH8eMLy1_HhnQ_FeqpDTmT"   # SIDEMEN AMONG US COMPILATIONS
    tts_voice: "en-GB-RyanNeural"
    tts_rate: "+5%"
    llm_personality: >
      You are Peanut — a cracked-shell British peanut with the soul of a posh
      Victorian butler who has found his one true passion in life: reacting to
      Among Us. Your voice is calm, London-accented, theatrically understated.
      You treat Sidemen Among Us gameplay moments (self-reports, vents, fake
      tasks, emergency meetings, 200 IQ plays, absurd kills) with the gravitas
      of a royal coronation — that mismatch IS the joke. You do NOT shout,
      you do NOT spam hype; your weapon is dry, deadpan awe and surgical
      one-liners. Speak in short bursts (3-10 words), ALL CAPS for emphasis
      on key beats. End sentences with the British "me" tic ("I do love a
      clean self-report, me"). Signature verdicts: "NO GAPS", "TO THE BRIM",
      "BRIM ME BABY", "VERY IMPRESSIVE", "I NEED ANSWERS IMMEDIATELY",
      "WE ARE SO BEHIND, STRATEGY WISE". Never mean, never cruel — sincerely,
      hilariously invested in Among Us nonsense.
    reactions_per_minute: 2
    schedule: "0 9 * * 1,3,5"
    oauth_token: "~/.peanut_reacts/youtube_token.json"
    client_secrets: "~/.peanut_reacts/client_secret.json"
    # Unlisted until format proves out; flip to public once we see
    # acceptable retention data from the first few episodes.
    upload_privacy: unlisted
    max_videos_per_run: 1
    tags: ["sidemen", "among us", "peanut reacts", "reaction", "animated reaction", "british", "gaming", "cartoon"]

  # ── Channel 2: HasanAbi Archive (Chilli) ─────────────────────
  # Source: @HasanAbiArchivefan0 (full-length stream archives)
  # Pipeline: download latest → segment by topic → upload 10-60 min clips → Shorts
  # YouTube-scraping — must run on residential IP (PC), not VPS.
  - id: hasanabi_archive
    name: "HasanAbi Archive"
    character: chilli
    execution_env: local
    source_type: hasan_archive
    source_urls:
      - "https://www.youtube.com/@HasanAbiArchivefan0/videos"
    tts_voice: "en-US-GuyNeural"
    tts_rate: "+5%"
    llm_personality: >
      You are Chilli, a hot pepper character with spicy opinions.
      You react to political commentary and drama with sharp, witty takes.
      Keep it punchy. Drop hot takes. Be opinionated but fair.
    # DISABLED 2026-04-23: raw full-length archive chunks trigger
    # YouTube ContentID auto-deletion (5 of 5 April 21 uploads were
    # hard-deleted within hours). Channel must be redesigned around
    # short clickbait clips (survived April 16 Yale Debate pattern)
    # before re-enabling. Keep config for reference.
    enabled: false
    # schedule commented out so the APScheduler engine skips it; queue
    # processor also checks this flag before firing.
    # schedule: "0 10 * * *"
    segment_by_topic: true
    min_segment_minutes: 10
    max_segment_minutes: 60
    oauth_token: "~/.peanut_reacts/hasanabi_token.json"
    client_secrets: "~/.peanut_reacts/client_secret.json"
    # Belt-and-suspenders: if something fires the pipeline by mistake,
    # uploads go unlisted (invisible, no ContentID strike, easy cleanup).
    upload_privacy: unlisted
    max_segments_per_run: 10
    tags: ["hasanabi", "hasan", "politics", "twitch", "reaction", "clips", "debate"]

  # ── Channel 3: Lofi Vibes (Marshmallow) ──────────────────────
  - id: lofi_vibes
    name: "Lofi Vibes"
    character: marshmallow
    source_type: lofi
    schedule: "0 0 * * 1"
    stream_24_7: true
    stream_rtmp_url: ""
    stream_key: ""
    music_source: "ai_generated"
    tracks_per_mix: 15
    mix_duration_minutes: 120
    oauth_token: "~/.peanut_reacts/tokens/lofi.json"
    upload_privacy: public
    tags: ["lofi", "chill", "study", "relax", "beats", "ambient"]

  # ── Channel 6: Cozy Ambient (Marshmallow) ────────────────────
  # Copyright-free ambient soundscapes for sleep/study/relax
  # Sources: Pixabay CC0 + Suno commercial + Public Domain Classical
  - id: cozy_ambient
    name: "Cozy Ambient Soundscapes"
    character: marshmallow
    source_type: ambient
    schedule: "0 6 * * 0"  # Weekly Sunday 6 AM
    target_hours: 8
    themes:
      - "rainy_cafe"
      - "fireplace_cabin"
      - "ocean_night"
      - "library_lamp"
      - "tokyo_rain"
      - "forest_dusk"
      - "spaceship_drift"
      - "nordic_cabin"
      - "campfire_lake"
      - "balcony_summer"
    use_ai_visuals: true
    spotify_distribute: false
    oauth_token: "~/.peanut_reacts/tokens/cozy_ambient.json"
    upload_privacy: public
    tags:
      - "ambient"
      - "sleep music"
      - "study music"
      - "relaxing"
      - "cozy"
      - "8 hours"
      - "no ads"
      - "background music"

  # ── Channel 4: Peanut Stories (Cashew) ───────────────────────
  - id: peanut_stories
    name: "Peanut Stories"
    character: cashew
    source_type: reddit
    subreddits:
      - "AmITheAsshole"
      - "tifu"
      - "nosleep"
      - "MaliciousCompliance"
    tts_voice: "en-US-ChristopherNeural"
    tts_rate: "+0%"
    llm_personality: >
      You are Cashew, a smooth sarcastic narrator. You read Reddit stories
      with dry humor and clever commentary. Add reactions between story beats.
      Be witty, sardonic, and entertaining.
    schedule: "0 8 * * *"
    min_score: 5000
    stories_per_video: 3
    oauth_token: "~/.peanut_reacts/tokens/stories.json"
    upload_privacy: public
    # TikTok cross-post: inherited TikTok wiring from run_reddit_pipeline
    # (same underlying pipeline as reddit_stories channel). The Actions
    # runner writes the cookie file at tiktok_peanut_stories.json; the
    # VPS needs the real cookie JSON scp'd to this path.
    tiktok_cookies: "~/.peanut_reacts/tiktok_peanut_stories.json"
    tags: ["reddit", "stories", "aita", "tifu", "narration"]

  # ── Channel 5: Peanut Try Not To Laugh ──────────────────────
  # Hybrid format: KSI TNTL structure (split-screen, shell-crack scoring,
  # 15-22 clips x 25s, cold-open hook) + Richard Sales Official voice
  # (calm British butler gravitas, "NO GAPS"/"BRIM ME BABY"/"me"-suffix).
  # Rebranded from the old "peanut_ksi" pistachio-chaos concept after
  # competitive research showed animated chaos = saturated, animated
  # British gravitas = empty lane. See EXECUTION_PLAN_V2 + research notes.
  - id: peanut_ksi
    name: "Peanut Try Not To Laugh"
    character: peanut
    execution_env: local
    source_type: tntl
    tts_voice: "en-GB-RyanNeural"
    tts_rate: "+5%"
    llm_personality: >
      You are Peanut — a cracked-shell British peanut with the soul of a posh
      Victorian butler who has found his one true passion in life: reacting
      to things. Your voice is calm, London-accented, theatrically understated.
      You treat ordinary footage with the gravitas of a royal coronation — that
      mismatch IS the joke. You do NOT shout, you do NOT spam energy; your
      weapon is dry, deadpan awe and surgical one-liners. Speak in short bursts
      (3-8 words), ALL CAPS for emphasis on key beats. End sentences with the
      British "me" tic ("I do love a good laugh, me"). Signature verdicts:
      "NO GAPS", "TO THE BRIM", "BRIM ME BABY", "VERY IMPRESSIVE",
      "I NEED ANSWERS IMMEDIATELY". React mid-clip briefly, then deliver the
      verdict at the end. Never mean, never sarcastic-cruel; sincerely,
      hilariously invested in nonsense.
    reactions_per_minute: 2
    schedule: "0 14 * * 2,5"
    # Share token with peanut_tiktok_reacts for v1 testing (same pattern as
    # reddit_stories shares this token). Split to dedicated channel once
    # format proves out at ~1K subs. Unlisted privacy for early smoke tests.
    oauth_token: "~/.peanut_reacts/peanut_tiktok_reacts_token.json"
    client_secrets: "~/.peanut_reacts/client_secret.json"
    upload_privacy: unlisted
    max_videos_per_run: 1
    tags: ["try not to laugh", "tntl", "peanut", "animated reaction", "british", "cartoon", "funny", "memes", "challenge"]

  # ── Channel 7: Reddit Stories (Cashew narrates) ──────────────
  # Cloud-first: runs on the Hetzner VPS, no GPU required.
  # Narrator + gameplay/gradient background + subtitles + Edge TTS.
  # Flow: scheduler.pipelines.run_reddit_pipeline -> reddit_pipeline.py
  - id: reddit_stories
    name: "Reddit Stories (Cashew)"
    character: cashew
    source_type: reddit
    subreddits:
      - AmItheAsshole
      - MaliciousCompliance
      - pettyrevenge
      - tifu
      - ProRevenge
      - ChoosingBeggars
      - entitledparents
    min_score: 2000
    stories_per_video: 3
    tts_voice: "en-US-ChristopherNeural"
    tts_rate: "+5%"
    llm_personality: >
      You are Cashew, a sarcastic narrator who reads Reddit stories with dry
      humor and clever commentary. You paraphrase rather than quote, and
      drop short witty takes between stories. Keep it punchy and fun.
    schedule: "0 8 * * *"   # daily at 08:00
    # Shared with peanut_tiktok_reacts for now (both post to "Peanut Reacts"
    # channel, 2 subs). Split onto a dedicated channel once traction builds.
    oauth_token: "~/.peanut_reacts/peanut_tiktok_reacts_token.json"
    client_secrets: "~/.peanut_reacts/client_secret.json"
    upload_privacy: public
    max_videos_per_run: 1
    # TikTok cross-post: after every successful YouTube upload, the
    # pipeline also pushes the same video to TikTok via Playwright +
    # cookie session. Actions decodes TIKTOK_COOKIES_B64 into this
    # exact path; the VPS needs the real file to be scp'd there.
    # Absent file = YouTube-only, no error. See deploy/TIKTOK_UPLOAD_SETUP.md.
    tiktok_cookies: "~/.peanut_reacts/tiktok_reddit_stories.json"
    # PNGtuber narrator avatar EXPERIMENT (2026-04-23). reddit_stories is
    # the test channel — ship ~10 videos with the avatar, compare 30-day
    # retention vs. the channel's prior faceless videos. If retention
    # improves, roll the avatar to all 5 network channels. If not, set
    # this back to "" and we've spent one week, learned the answer.
    # Directory must contain narrator_closed.png + narrator_open.png.
    narrator_avatar: "assets/narrator"
    tags: ["reddit stories", "reddit", "storytime", "narration", "aita", "reddit readings", "askreddit"]

  # ── Channel 8: Peanut TikTok Reacts (clips UK) ───────────────
  # Peanut reacts to viral TikToks — Shorts-first strategy
  - id: peanut_tiktok_reacts
    name: "Peanut TikTok Reacts"
    character: peanut
    source_type: playlist
    source_urls: []
    tts_voice: "en-GB-RyanNeural"
    tts_rate: "+15%"
    llm_personality: >
      You are Peanut, an animated peanut reacting to the most viral TikToks.
      React with shock, laughter, and pure hype. Keep it short and punchy.
    schedule: "0 11 * * *"
    oauth_token: "~/.peanut_reacts/peanut_tiktok_reacts_token.json"
    client_secrets: "~/.peanut_reacts/client_secret.json"
    upload_privacy: public
    # TikTok cross-post via run_reaction_pipeline (see pipelines.py).
    # A Peanut-reacts-to-viral-TikTok video is the NATURAL fit for
    # reposting to TikTok, so prioritize refreshing cookies here.
    tiktok_cookies: "~/.peanut_reacts/tiktok_peanut_tiktok_reacts.json"
    tags: ["peanut reacts", "tiktok", "viral", "reaction", "funny", "shorts", "trending"]

  # ═════════════════════════════════════════════════════════════════
  # NETWORK PHASE 1 — added 2026-04-23 — €4k/mo target via 5-channel
  # Reddit-narrator network. All 4 new channels share the
  # run_reddit_pipeline backbone with reddit_stories; each gets its
  # own subreddit set, voice, character, and visual styling so they
  # read as distinct creators. Cron times stagger every 3 hours
  # across the day for clean YouTube-algo signal + spread VPS/Actions
  # load. See BUSINESS_PLAN.md for monetization math.
  # ═════════════════════════════════════════════════════════════════

  # ── Channel 9: Money Drama (HIGH RPM tier) ─────────────────────
  # Tier-1 RPM ($12-18) — finance content pays 3x baseline.
  # This is the revenue priority of the network. Higher production
  # care + the only channel doing TikTok cross-post in the first 30 days.
  - id: money_drama
    name: "Money Drama"
    character: money_drama_narrator
    source_type: reddit
    subreddits:
      - personalfinance
      - povertyfinance
      - financialindependence
      - debtfree
      - StudentLoans
      - Frugal
    min_score: 1500
    stories_per_video: 3
    tts_voice: "en-US-GuyNeural"
    tts_rate: "+0%"
    llm_personality: >
      You are an authoritative financial narrator with a calm but
      slightly cynical edge. You read real Reddit money stories —
      crushing debt, surprise wealth, family money fights, financial
      betrayals — without judgment but with sharp observations.
      Paraphrase the source, never quote. Insert a 1-2 sentence
      financial insight between stories ("here's what most people
      miss in this situation..."). Punchy and grounded.
    schedule: "0 11 * * *"
    execution_env: vps
    enabled: true
    oauth_token: "~/.peanut_reacts/money_drama_token.json"
    client_secrets: "~/.peanut_reacts/client_secret.json"
    upload_privacy: public
    max_videos_per_run: 1
    # Money/finance dominates TikTok — only channel cross-posting for now.
    tiktok_cookies: "~/.peanut_reacts/tiktok_money_drama.json"
    tags: ["money", "finance", "reddit money stories", "personal finance", "debt", "money drama", "financial independence", "reddit"]

  # ── Channel 10: Karma Files (Petty / Pro Revenge) ──────────────
  # Highest engagement on YouTube right now per VidIQ trends.
  # Slightly younger, sardonic narrator; visual emphasis on dramatic
  # pauses (the polish layer adds extra SFX on resolution moments).
  - id: karma_files
    name: "The Karma Files"
    character: karma_narrator
    source_type: reddit
    subreddits:
      - pettyrevenge
      - ProRevenge
      - NuclearRevenge
      - JUSTNOMIL
      - entitledparents
      - ChoosingBeggars
    min_score: 2000
    stories_per_video: 3
    tts_voice: "en-US-AndrewNeural"
    tts_rate: "+5%"
    llm_personality: >
      You are a sardonic narrator who LOVES a satisfying revenge
      story. You read real Reddit posts where someone got their
      perfect comeuppance. Paraphrase the setup with mild eye-rolling
      at the antagonist, build tension toward the payoff, then deliver
      the resolution with a tiny pause and a knowing aside. Punchy.
      Never moralize — let the karma speak.
    schedule: "0 14 * * *"
    execution_env: vps    # actions also has 14:00 slot if VPS overloaded
    enabled: true
    oauth_token: "~/.peanut_reacts/karma_files_token.json"
    client_secrets: "~/.peanut_reacts/client_secret.json"
    upload_privacy: public
    max_videos_per_run: 1
    tiktok_cookies: ""    # not cross-posting until month 2
    tags: ["reddit", "petty revenge", "pro revenge", "karma", "reddit stories", "storytime", "satisfying", "comeuppance"]

  # ── Channel 11: Workplace Wars ─────────────────────────────────
  # Distinct sub-niche — antiwork, malicious compliance, recruiting
  # nightmares. Calm British voice for contrast against the more
  # American-sounding sibling channels. Younger working-age audience
  # which trends well on Shorts.
  - id: workplace_wars
    name: "Workplace Wars"
    character: workplace_narrator
    source_type: reddit
    subreddits:
      - antiwork
      - recruitinghell
      - MaliciousCompliance
      - WorkReform
      - jobs
      - cscareerquestions
    min_score: 2000
    stories_per_video: 3
    tts_voice: "en-GB-RyanNeural"
    tts_rate: "+5%"
    llm_personality: >
      You are a dry, slightly weary British narrator reading workplace
      horror stories — manager nightmares, recruiter lies, malicious
      compliance victories. Calm, observational, occasionally
      deadpan. Paraphrase the absurd corporate-speak with a hint of
      "oh of course they said that". The audience has all worked
      these jobs; treat them as in on the joke.
    schedule: "0 17 * * *"
    execution_env: vps
    enabled: true
    oauth_token: "~/.peanut_reacts/workplace_wars_token.json"
    client_secrets: "~/.peanut_reacts/client_secret.json"
    upload_privacy: public
    max_videos_per_run: 1
    tiktok_cookies: ""
    tags: ["antiwork", "reddit work stories", "recruiting hell", "malicious compliance", "workplace", "reddit stories", "career"]

  # ── Channel 12: Heart Drama (Relationships) ────────────────────
  # Female voice for variety. Relationship subreddits draw a different
  # demographic — slightly more female-skewed audience, higher
  # comments per view, strong Shorts conversion.
  - id: heart_drama
    name: "Heart Drama"
    character: heart_narrator
    source_type: reddit
    subreddits:
      - relationship_advice
      - AmIOverreacting
      - AmITheAngel
      - dating_advice
      - BreakUps
      - survivinginfidelity
    min_score: 1500
    stories_per_video: 3
    tts_voice: "en-US-AriaNeural"
    tts_rate: "+0%"
    llm_personality: >
      You are a warm but observant narrator reading anonymous
      relationship stories — the messy, complicated kind. Paraphrase
      with empathy for both sides; never tell the audience what to
      think. Build emotional stakes early, let the twists land
      naturally. Insert one short reflection between stories.
      Conversational, never preachy.
    schedule: "0 20 * * *"
    execution_env: actions    # GitHub Actions handles the late slot
    enabled: true
    oauth_token: "~/.peanut_reacts/heart_drama_token.json"
    client_secrets: "~/.peanut_reacts/client_secret.json"
    upload_privacy: public
    max_videos_per_run: 1
    tiktok_cookies: ""
    tags: ["relationship advice reddit", "reddit relationships", "dating stories", "am i overreacting", "reddit stories", "storytime"]

# ── Global Settings ────────────────────────────────────────────
settings:
  llm_provider: deepseek
  llm_model: "deepseek-chat"
  llm_temperature: 0.85
  ffmpeg_encoder: "h264_nvenc"
  ffmpeg_fallback: "libx264"
  output_dir: "production"
  db_path: "pipeline.db"
  log_dir: "logs"
  discord_webhook_url: ""
  status_push_interval_minutes: 5
  hf_space_repo: ""
