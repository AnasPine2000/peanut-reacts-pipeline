# ═══════════════════════════════════════════════════════════════
# Multi-Channel YouTube Pipeline Configuration
# Each channel has its own character, schedule, and content source
# ═══════════════════════════════════════════════════════════════

channels:
  # ── Channel 1: Peanut Reacts (Sidemen Among Us) ──────────────
  # YouTube-scraping — must run on residential IP (PC), not VPS.
  - id: uk_clips
    name: "UK CLIPS (Peanut Reacts)"
    character: peanut
    execution_env: local
    source_type: playlist
    source_urls:
      - "https://www.youtube.com/playlist?list=PLhjLcvbbPVrVOY5w5Pl7KuSe5fGroQJJD"   # SIDEMEN AMONG US (full eps)
      - "https://www.youtube.com/playlist?list=PLhjLcvbbPVrVH8eMLy1_HhnQ_FeqpDTmT"   # SIDEMEN AMONG US COMPILATIONS
    tts_voice: "en-GB-RyanNeural"
    tts_rate: "+15%"
    llm_personality: >
      You are Peanut, an excitable animated peanut character watching Sidemen Among Us.
      You're a massive fan. React with hype, shock, humor, and hot takes.
      Keep reactions SHORT (1-2 sentences max). Be entertaining and loud.
    reactions_per_minute: 6
    gameplay_volume: 0.12
    reaction_boost: 5.0
    schedule: "0 9 * * 1,3,5"
    oauth_token: "~/.peanut_reacts/youtube_token.json"
    client_secrets: "~/.peanut_reacts/client_secret.json"
    upload_privacy: public
    max_videos_per_run: 2
    video_format: compilation
    compilation_hours: 5
    tags: ["sidemen", "among us", "peanut reacts", "reaction", "compilation", "gaming"]

  # ── Channel 2: HasanAbi Archive (Chilli) ─────────────────────
  # Source: @HasanAbiArchivefan0 (full-length stream archives)
  # Pipeline: download latest → segment by topic → upload 10-60 min clips → Shorts
  # YouTube-scraping — must run on residential IP (PC), not VPS.
  - id: hasanabi_archive
    name: "HasanAbi Archive"
    character: chilli
    execution_env: local
    source_type: hasan_archive
    source_urls:
      - "https://www.youtube.com/@HasanAbiArchivefan0/videos"
    tts_voice: "en-US-GuyNeural"
    tts_rate: "+5%"
    llm_personality: >
      You are Chilli, a hot pepper character with spicy opinions.
      You react to political commentary and drama with sharp, witty takes.
      Keep it punchy. Drop hot takes. Be opinionated but fair.
    schedule: "0 10 * * *"
    segment_by_topic: true
    min_segment_minutes: 10
    max_segment_minutes: 60
    oauth_token: "~/.peanut_reacts/hasanabi_token.json"
    client_secrets: "~/.peanut_reacts/client_secret.json"
    upload_privacy: public
    max_segments_per_run: 10
    tags: ["hasanabi", "hasan", "politics", "twitch", "reaction", "clips", "debate"]

  # ── Channel 3: Lofi Vibes (Marshmallow) ──────────────────────
  - id: lofi_vibes
    name: "Lofi Vibes"
    character: marshmallow
    source_type: lofi
    schedule: "0 0 * * 1"
    stream_24_7: true
    stream_rtmp_url: ""
    stream_key: ""
    music_source: "ai_generated"
    tracks_per_mix: 15
    mix_duration_minutes: 120
    oauth_token: "~/.peanut_reacts/tokens/lofi.json"
    upload_privacy: public
    tags: ["lofi", "chill", "study", "relax", "beats", "ambient"]

  # ── Channel 6: Cozy Ambient (Marshmallow) ────────────────────
  # Copyright-free ambient soundscapes for sleep/study/relax
  # Sources: Pixabay CC0 + Suno commercial + Public Domain Classical
  - id: cozy_ambient
    name: "Cozy Ambient Soundscapes"
    character: marshmallow
    source_type: ambient
    schedule: "0 6 * * 0"  # Weekly Sunday 6 AM
    target_hours: 8
    themes:
      - "rainy_cafe"
      - "fireplace_cabin"
      - "ocean_night"
      - "library_lamp"
      - "tokyo_rain"
      - "forest_dusk"
      - "spaceship_drift"
      - "nordic_cabin"
      - "campfire_lake"
      - "balcony_summer"
    use_ai_visuals: true
    spotify_distribute: false
    oauth_token: "~/.peanut_reacts/tokens/cozy_ambient.json"
    upload_privacy: public
    tags:
      - "ambient"
      - "sleep music"
      - "study music"
      - "relaxing"
      - "cozy"
      - "8 hours"
      - "no ads"
      - "background music"

  # ── Channel 4: Peanut Stories (Cashew) ───────────────────────
  - id: peanut_stories
    name: "Peanut Stories"
    character: cashew
    source_type: reddit
    subreddits:
      - "AmITheAsshole"
      - "tifu"
      - "nosleep"
      - "MaliciousCompliance"
    tts_voice: "en-US-ChristopherNeural"
    tts_rate: "+0%"
    llm_personality: >
      You are Cashew, a smooth sarcastic narrator. You read Reddit stories
      with dry humor and clever commentary. Add reactions between story beats.
      Be witty, sardonic, and entertaining.
    schedule: "0 8 * * *"
    min_score: 5000
    stories_per_video: 3
    oauth_token: "~/.peanut_reacts/tokens/stories.json"
    upload_privacy: public
    tags: ["reddit", "stories", "aita", "tifu", "narration"]

  # ── Channel 5: Peanut Try Not To Laugh ──────────────────────
  # Hybrid format: KSI TNTL structure (split-screen, shell-crack scoring,
  # 15-22 clips x 25s, cold-open hook) + Richard Sales Official voice
  # (calm British butler gravitas, "NO GAPS"/"BRIM ME BABY"/"me"-suffix).
  # Rebranded from the old "peanut_ksi" pistachio-chaos concept after
  # competitive research showed animated chaos = saturated, animated
  # British gravitas = empty lane. See EXECUTION_PLAN_V2 + research notes.
  - id: peanut_ksi
    name: "Peanut Try Not To Laugh"
    character: peanut
    execution_env: local
    source_type: tntl
    tts_voice: "en-GB-RyanNeural"
    tts_rate: "+5%"
    llm_personality: >
      You are Peanut — a cracked-shell British peanut with the soul of a posh
      Victorian butler who has found his one true passion in life: reacting
      to things. Your voice is calm, London-accented, theatrically understated.
      You treat ordinary footage with the gravitas of a royal coronation — that
      mismatch IS the joke. You do NOT shout, you do NOT spam energy; your
      weapon is dry, deadpan awe and surgical one-liners. Speak in short bursts
      (3-8 words), ALL CAPS for emphasis on key beats. End sentences with the
      British "me" tic ("I do love a good laugh, me"). Signature verdicts:
      "NO GAPS", "TO THE BRIM", "BRIM ME BABY", "VERY IMPRESSIVE",
      "I NEED ANSWERS IMMEDIATELY". React mid-clip briefly, then deliver the
      verdict at the end. Never mean, never sarcastic-cruel; sincerely,
      hilariously invested in nonsense.
    reactions_per_minute: 2
    schedule: "0 14 * * 2,5"
    # Share token with peanut_tiktok_reacts for v1 testing (same pattern as
    # reddit_stories shares this token). Split to dedicated channel once
    # format proves out at ~1K subs. Unlisted privacy for early smoke tests.
    oauth_token: "~/.peanut_reacts/peanut_tiktok_reacts_token.json"
    client_secrets: "~/.peanut_reacts/client_secret.json"
    upload_privacy: unlisted
    max_videos_per_run: 1
    tags: ["try not to laugh", "tntl", "peanut", "animated reaction", "british", "cartoon", "funny", "memes", "challenge"]

  # ── Channel 7: Reddit Stories (Cashew narrates) ──────────────
  # Cloud-first: runs on the Hetzner VPS, no GPU required.
  # Narrator + gameplay/gradient background + subtitles + Edge TTS.
  # Flow: scheduler.pipelines.run_reddit_pipeline -> reddit_pipeline.py
  - id: reddit_stories
    name: "Reddit Stories (Cashew)"
    character: cashew
    source_type: reddit
    subreddits:
      - AmItheAsshole
      - MaliciousCompliance
      - pettyrevenge
      - tifu
      - ProRevenge
      - ChoosingBeggars
      - entitledparents
    min_score: 2000
    stories_per_video: 3
    tts_voice: "en-US-ChristopherNeural"
    tts_rate: "+5%"
    llm_personality: >
      You are Cashew, a sarcastic narrator who reads Reddit stories with dry
      humor and clever commentary. You paraphrase rather than quote, and
      drop short witty takes between stories. Keep it punchy and fun.
    schedule: "0 8 * * *"   # daily at 08:00
    # Shared with peanut_tiktok_reacts for now (both post to "Peanut Reacts"
    # channel, 2 subs). Split onto a dedicated channel once traction builds.
    oauth_token: "~/.peanut_reacts/peanut_tiktok_reacts_token.json"
    client_secrets: "~/.peanut_reacts/client_secret.json"
    upload_privacy: public
    max_videos_per_run: 1
    tags: ["reddit stories", "reddit", "storytime", "narration", "aita", "reddit readings", "askreddit"]

  # ── Channel 8: Peanut TikTok Reacts (clips UK) ───────────────
  # Peanut reacts to viral TikToks — Shorts-first strategy
  - id: peanut_tiktok_reacts
    name: "Peanut TikTok Reacts"
    character: peanut
    source_type: playlist
    source_urls: []
    tts_voice: "en-GB-RyanNeural"
    tts_rate: "+15%"
    llm_personality: >
      You are Peanut, an animated peanut reacting to the most viral TikToks.
      React with shock, laughter, and pure hype. Keep it short and punchy.
    schedule: "0 11 * * *"
    oauth_token: "~/.peanut_reacts/peanut_tiktok_reacts_token.json"
    client_secrets: "~/.peanut_reacts/client_secret.json"
    upload_privacy: public
    tags: ["peanut reacts", "tiktok", "viral", "reaction", "funny", "shorts", "trending"]

# ── Global Settings ────────────────────────────────────────────
settings:
  llm_provider: deepseek
  llm_model: "deepseek-chat"
  llm_temperature: 0.85
  ffmpeg_encoder: "h264_nvenc"
  ffmpeg_fallback: "libx264"
  output_dir: "production"
  db_path: "pipeline.db"
  log_dir: "logs"
  discord_webhook_url: ""
  status_push_interval_minutes: 5
  hf_space_repo: ""
