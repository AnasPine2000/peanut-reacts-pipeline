# Canonical label set. Sync with: gh label create / update via a bootstrap script.
# Priorities follow the EXECUTION_PLAN_V2 convention (P0 > P1 > P2).

# ── Priority ─────────────────────────────────────────────────────────
- name: P0
  color: "b60205"
  description: Blocker — stops a phase from progressing
- name: P1
  color: "d93f0b"
  description: Important — should land this phase
- name: P2
  color: "fbca04"
  description: Nice-to-have — backlog until capacity

# ── Type ────────────────────────────────────────────────────────────
- name: bug
  color: "ee0701"
  description: Something isn't working
- name: enhancement
  color: "a2eeef"
  description: New capability or improvement
- name: task
  color: "c5def5"
  description: Scheduled task from EXECUTION_PLAN_V2
- name: docs
  color: "0075ca"
  description: Documentation
- name: infra
  color: "5319e7"
  description: CI / CD / tooling / deploy
- name: dependencies
  color: "0366d6"
  description: Dependency update

# ── Area ────────────────────────────────────────────────────────────
