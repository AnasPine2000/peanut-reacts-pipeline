name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"

jobs:
  # ── Fast checks: lint, format, basic static analysis ────────────────
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install ruff
        run: pip install ruff==0.6.9
      - name: Ruff check
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .

  # ── Type check ──────────────────────────────────────────────────────
  typecheck:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    continue-on-error: true   # gradual typing — don't block PRs yet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install mypy + project (minimal)
        run: |
          pip install mypy==1.11.2 types-PyYAML types-requests
      - name: Run mypy
        run: mypy src/peanut_reacts || true   # soft-fail for now

  # ── Unit tests ──────────────────────────────────────────────────────
  unit:
    name: Unit tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install ffmpeg (some tests mock it, others need ffprobe)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install project + dev deps
        run: |
          pip install --upgrade pip wheel
          # Install a lightweight set — avoid heavy ML deps in CI
          pip install \
            pytest>=8.0 pytest-cov>=5.0 pytest-asyncio>=0.23 pytest-xdist>=3.5 \
            Pillow numpy pyyaml httpx edge-tts>=6.1 openpyxl
          # Install our package without deps to avoid torch/whisper pulls
          pip install --no-deps -e .
      - name: Run unit tests
        run: pytest tests/unit -v --cov=peanut_reacts --cov-report=xml --cov-report=term
      - name: Upload coverage (Python 3.11 only)
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 7

  # ── Integration tests (slower, run less often) ──────────────────────
  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    needs: unit
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'run-integration')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install project + test deps
        run: |
          pip install --upgrade pip wheel
          pip install pytest>=8.0 pytest-asyncio>=0.23 \
            Pillow numpy pyyaml httpx edge-tts>=6.1 openpyxl
          pip install --no-deps -e .
      - name: Run integration tests
        run: pytest tests/integration -v -m "integration and not gpu"
        env:
          PYTEST_INTEGRATION_MODE: "mocked"
