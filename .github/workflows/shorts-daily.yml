name: shorts-daily

# GitHub Actions-native Shorts pipeline.
#
# Runs a single channel's pipeline on a free GitHub-hosted runner, fully
# independent of the Hetzner VPS. This is our path to multiplying daily
# upload volume without provisioning more servers.
#
# CRON strategy:
#   VPS fires reddit_stories at 08:00 UTC daily
#   Actions fires it again at 15:00 UTC and 20:00 UTC
#   -> 3 distinct Reddit Shorts per day, 0 extra infra cost
#
# Workflow dispatch (manual trigger):
#   Go to Actions tab -> shorts-daily -> Run workflow. Pick a channel,
#   pick dry-run yes/no. Dry-run uploads go as 'private' so you can
#   verify the video on YouTube Studio without a public drop.

on:
  schedule:
    # 15:00 UTC and 20:00 UTC daily. (VPS already covers 08:00 UTC.)
    - cron: "0 15 * * *"
    - cron: "0 20 * * *"
  workflow_dispatch:
    inputs:
      channel:
        description: "Channel id from channels.yaml"
        required: true
        default: "reddit_stories"
        type: choice
        options:
          - reddit_stories
          - peanut_tiktok_reacts
          - peanut_stories
      dry_run:
        description: "Upload as 'private' instead of the channel's configured privacy"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

# Only one Shorts build at a time so two cron ticks can't race on the
# pipeline DB or collide on a source URL.
concurrency:
  group: shorts-daily
  cancel-in-progress: false

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 45   # Shorts build should be <15 min; cap protects runner budget

    # Default channel for scheduled runs; dispatch input overrides it.
    env:
      PEANUT_CHANNEL_ID: ${{ github.event.inputs.channel || 'reddit_stories' }}
      # Default DRY_RUN was 'true' during setup (forces uploads to
      # privacy=private so we could verify the pipeline end-to-end
      # without polluting the public channel). Flipped to 'false' on
      # 2026-04-23 after run #2 succeeded end-to-end (video
      # 6C5ZALV2w6w verified). Scheduled crons now go LIVE to the
      # Peanut Reacts channel. Manual workflow_dispatch runs can still
      # pass dry_run=true via the input if you want to test.
      DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
      # Opt into Node.js 24 for JavaScript actions (setup-python,
      # checkout, cache, upload-artifact). GitHub forces this from
      # 2026-06-02 anyway; flipping it now silences the deprecation
      # annotation that shows up on every run.
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      # ---- API keys (add to repo Settings -> Secrets -> Actions) ----
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      # Scrape.do: export under both names because different codepaths
      # inside the repo use different env names (historical drift).
      # The unified name to add as a secret is SCRAPEDO_API_TOKEN.
      SCRAPEDO_API_TOKEN: ${{ secrets.SCRAPEDO_API_TOKEN }}
      SCRAPE_DO_TOKEN: ${{ secrets.SCRAPEDO_API_TOKEN }}
      # Reddit OAuth (free, register at reddit.com/prefs/apps). Required
      # for reddit_stories from cloud runners because Reddit 403s
      # datacenter IPs on the public JSON endpoint. Scrape.do works as
      # an alternative but costs $5/mo and Reddit OAuth is free.
      REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
      REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
      REDDIT_USER_AGENT: ${{ secrets.REDDIT_USER_AGENT }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      # Cloud vision (C2): enables cloud GPU describe calls from the
      # runner. Without this, clip_context falls through to Groq's
      # rate-limited free tier, which throttles hard on multi-describe
      # Shorts. Get one at replicate.com/account/api-tokens — cost is
      # ~$0.003 per describe, $1-3/mo at current volume.
      REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
      # TikTok cross-post (C3): base64-encoded browser cookie export.
      # When present, the runner writes it to
      # ~/.peanut_reacts/tiktok_<channel>.json and the pipeline can
      # cross-post to TikTok via Playwright after the YouTube upload
      # succeeds. Empty = skip TikTok, YouTube-only upload.
      TIKTOK_COOKIES_B64: ${{ secrets.TIKTOK_COOKIES_B64 }}
      # ---- OAuth blobs (base64 of the JSON files) ----
      YT_CLIENT_SECRET_B64: ${{ secrets.YT_CLIENT_SECRET_B64 }}
      YT_TOKEN_B64: ${{ secrets.YT_TOKEN_B64 }}
      # ---- Runtime hygiene ----
      PYTHONUNBUFFERED: "1"
      PYTHONIOENCODING: "utf-8"
      TZ: "UTC"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -1
          ffprobe -version | head -1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-actions.txt

      - name: Install Python deps (slim)
        run: |
          python -m pip install --upgrade pip
          pip install -q -r requirements-actions.txt
          # Install the peanut_reacts package itself in editable mode so
          # `python -m peanut_reacts.scheduler.runner` etc. resolve.
          pip install -q -e .
          python -c "import peanut_reacts; print('peanut_reacts OK')"

      - name: Install Playwright Chromium
        # Only needed for TikTok cross-post. If you don't use TikTok,
        # this step still runs but the cost is ~15 s cached — not worth
        # guarding. If cache is cold it's ~90 s.
        uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-v1
      - name: Download Chromium (if cache miss)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: playwright install --with-deps chromium

      - name: Preflight — secrets present?
        run: |
          missing=()
          [[ -z "$DEEPSEEK_API_KEY" ]] && missing+=("DEEPSEEK_API_KEY")
          [[ -z "$YT_CLIENT_SECRET_B64" ]] && missing+=("YT_CLIENT_SECRET_B64")
          [[ -z "$YT_TOKEN_B64" ]] && missing+=("YT_TOKEN_B64")
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "::error ::Missing required secrets: ${missing[*]}"
            echo "See deploy/ACTIONS_SHORTS_SETUP.md for setup steps."
            exit 1
          fi
          echo "All required secrets present."

      - name: Run Shorts pipeline
        run: |
          python scripts/actions_shorts_runner.py --channel "$PEANUT_CHANNEL_ID"
        timeout-minutes: 30

      - name: Upload pipeline DB as artifact (for debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-db-${{ github.run_id }}
          path: |
            pipeline.db
            data/pipeline_status.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Notify Discord on failure
        if: failure() && env.DISCORD_WEBHOOK_URL != ''
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          curl -s -H "Content-Type: application/json" \
               -d "{\"content\": \"Shorts pipeline failed on GitHub Actions: channel=$PEANUT_CHANNEL_ID  run=${{ github.run_id }}  https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
               "$DISCORD_WEBHOOK_URL" || true
