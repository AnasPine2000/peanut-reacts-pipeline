[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "peanut-reacts"
version = "0.1.0"
description = "YouTube reaction video creation toolkit with animated peanut character"
requires-python = ">=3.10"
dependencies = [
    "yt-dlp>=2024.1.0",
    "Pillow>=10.0.0",
    "openai-whisper>=20231117",
    "sentence-transformers>=2.2.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "pysrt>=1.1.2",
    "moviepy>=1.0.3",
    "pydub>=0.25.1",
    "edge-tts>=6.1.0",
    "httpx>=0.25.0",
    "google-api-python-client>=2.100.0",
    "google-auth-oauthlib>=1.1.0",
]

[project.scripts]
peanut-download-playlist = "peanut_reacts.cli.download_playlist:main"
peanut-download-thumbnails = "peanut_reacts.cli.download_thumbnails:main"
peanut-download-subtitles = "peanut_reacts.cli.download_subtitles:main"
peanut-download-channel = "peanut_reacts.cli.download_channel:main"
peanut-search-keywords = "peanut_reacts.cli.search_keywords:main"
peanut-detect-loud = "peanut_reacts.cli.detect_loud:main"
peanut-segment-topics = "peanut_reacts.cli.segment_topics:main"
peanut-render-character = "peanut_reacts.cli.render_character:main"
peanut-overlay = "peanut_reacts.cli.overlay:main"
peanut-concat = "peanut_reacts.cli.concat:main"
peanut-download-comments = "peanut_reacts.cli.download_comments:main"
peanut-fetch-comments = "peanut_reacts.cli.fetch_comments:main"
peanut-extract-comments = "peanut_reacts.cli.extract_comments:main"
peanut-generate-reactions = "peanut_reacts.cli.generate_reactions:main"
peanut-synthesize-tts = "peanut_reacts.cli.synthesize_tts:main"
peanut-render-synced = "peanut_reacts.cli.render_synced:main"
peanut-react = "peanut_reacts.cli.react:main"
peanut-shorts = "peanut_reacts.cli.shorts:main"
peanut-compile = "peanut_reacts.cli.compile:main"
peanut-decoded = "peanut_reacts.cli.decoded:main"
peanut-batch = "peanut_reacts.cli.batch:main"
peanut-upload = "peanut_reacts.cli.upload:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "pytest-xdist>=3.5",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "types-PyYAML",
    "types-requests",
]

[tool.setuptools.packages.find]
where = ["src"]

# ─────────────────────────────────────────────────────────────────────────
# Testing
# ─────────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
    "--tb=short",
]
markers = [
    "slow: tests that take more than a few seconds",
    "integration: end-to-end tests that hit external services or subprocesses",
    "gpu: tests that require a CUDA GPU",
    "benchmark: performance benchmarks (opt-in via -m benchmark)",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["src/peanut_reacts"]
branch = true
omit = [
    "*/cli/*",
    "*/__main__.py",
    "*/tests/*",
]

[tool.coverage.report]
precision = 1
show_missing = true
skip_covered = false
fail_under = 40   # start modest, ratchet up over time
exclude_also = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

# ─────────────────────────────────────────────────────────────────────────
# Linting & formatting (ruff replaces black + isort + flake8)
# ─────────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [
    "external",
    "lib/wav2lip",
    "docs",
    ".claude",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "RET",  # flake8-return
]
ignore = [
    "E501",   # line too long — handled by formatter
    "B008",   # function call in arg defaults (common in pipelines)
    "SIM108", # ternary-vs-if preference — subjective
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B", "SIM"]       # tests may duplicate, shadow, etc.
"scripts/**" = ["B", "SIM"]      # one-off scripts

# ─────────────────────────────────────────────────────────────────────────
# Type checking (opt-in for each module via type stubs as we go)
# ─────────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.10"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false   # gradual typing — strict on new code only
disallow_incomplete_defs = false
check_untyped_defs = true
ignore_missing_imports = true
files = ["src/peanut_reacts"]
